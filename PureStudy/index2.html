<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세 - 신비의 카드</title>
<style>
  :root{
    --bg-deep:#07040f;
    --bg-mid:#150a2e;
    --bg-violet:#2a1150;
    --purple:#7b3fe4;
    --purple-soft:#9d6bff;
    --gold:#e8c477;
    --gold-bright:#f5dca0;
    --pink:#c04fd0;
    --text:#ece4fb;
    --text-dim:#9c8fc2;
    --card-back-1:#1c0f3d;
    --card-back-2:#3a1a5e;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif;
    overflow-x:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 80px;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(123,63,228,0.35), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 20%, rgba(192,79,208,0.18), transparent 60%),
      radial-gradient(ellipse 70% 50% at 10% 80%, rgba(123,63,228,0.2), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-violet) 100%);
    background-attachment:fixed;
  }

  /* twinkling stars */
  #stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .star{
    position:absolute;
    background:var(--text);
    border-radius:50%;
    opacity:0.6;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15; transform:scale(0.8);}
    50%{opacity:0.9; transform:scale(1.2);}
  }

  .glow-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    pointer-events:none;
    z-index:0;
    opacity:0.5;
  }
  .glow-orb.a{
    width:320px; height:320px;
    background:radial-gradient(circle, rgba(123,63,228,0.6), transparent 70%);
    top:-80px; left:-100px;
    animation:float1 14s ease-in-out infinite;
  }
  .glow-orb.b{
    width:260px; height:260px;
    background:radial-gradient(circle, rgba(192,79,208,0.5), transparent 70%);
    bottom:-60px; right:-80px;
    animation:float2 17s ease-in-out infinite;
  }
  @keyframes float1{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(30px,40px);}
  }
  @keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-25px,-30px);}
  }

  header{
    position:relative;
    z-index:1;
    text-align:center;
    margin-bottom:12px;
    max-width:600px;
  }

  .date-tag{
    display:inline-block;
    font-size:0.78rem;
    letter-spacing:0.15em;
    color:var(--gold);
    border:1px solid rgba(232,196,119,0.35);
    padding:5px 16px;
    border-radius:999px;
    margin-bottom:18px;
    background:rgba(232,196,119,0.06);
  }

  h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    background:linear-gradient(135deg, var(--gold-bright), var(--purple-soft) 60%, var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:0.02em;
    margin-bottom:14px;
    text-shadow:0 0 40px rgba(157,107,255,0.25);
  }

  .subtitle{
    color:var(--text-dim);
    font-size:0.98rem;
    line-height:1.7;
  }

  .instruction{
    position:relative;
    z-index:1;
    margin:26px 0 38px;
    font-size:0.95rem;
    color:var(--purple-soft);
    letter-spacing:0.05em;
    min-height:24px;
    transition:opacity 0.3s ease;
  }

  .cards-grid{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(4, minmax(72px, 100px));
    gap:16px 18px;
    max-width:520px;
    width:100%;
    justify-content:center;
    perspective:1200px;
  }

  .card{
    aspect-ratio:2/3;
    cursor:pointer;
    perspective:1000px;
    transition:transform 0.35s ease, opacity 0.35s ease, filter 0.35s ease;
  }

  .card.disabled{
    pointer-events:none;
  }

  .card.dim{
    opacity:0.25;
    filter:grayscale(0.6) blur(0.5px);
    transform:scale(0.94);
  }

  .card.peek{
    opacity:0.9;
    filter:none;
    transform:scale(0.96);
    pointer-events:auto;
    cursor:pointer;
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    transform-style:preserve-3d;
  }

  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }

  .card.selected{
    transform:scale(1.08);
    pointer-events:auto;
    cursor:pointer;
  }

  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .card-back{
    background:
      radial-gradient(circle at 50% 30%, rgba(232,196,119,0.12), transparent 55%),
      linear-gradient(155deg, var(--card-back-2), var(--card-back-1) 70%);
    border:1px solid rgba(232,196,119,0.3);
    box-shadow:
      0 4px 18px rgba(0,0,0,0.45),
      inset 0 0 22px rgba(123,63,228,0.35);
    transition:box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .card:not(.disabled):hover .card-back{
    border-color:rgba(232,196,119,0.7);
    box-shadow:
      0 6px 24px rgba(0,0,0,0.5),
      0 0 20px rgba(232,196,119,0.25),
      inset 0 0 24px rgba(123,63,228,0.45);
  }

  .card-back::before{
    content:'';
    position:absolute;
    inset:6px;
    border:1px solid rgba(232,196,119,0.25);
    border-radius:7px;
  }

  .back-symbol{
    font-size:1.6rem;
    color:var(--gold);
    opacity:0.85;
    filter:drop-shadow(0 0 8px rgba(232,196,119,0.5));
  }

  .card-front{
    background:linear-gradient(160deg, #2b1450, #150a2e 75%);
    border:1px solid rgba(157,107,255,0.5);
    transform:rotateY(180deg);
    flex-direction:column;
    padding:6px;
    box-shadow:inset 0 0 20px rgba(123,63,228,0.4);
  }

  .front-icon{
    font-size:1.5rem;
    margin-bottom:4px;
    filter:drop-shadow(0 0 6px rgba(157,107,255,0.6));
  }

  .front-label{
    font-size:0.62rem;
    color:var(--gold-bright);
    text-align:center;
    letter-spacing:0.03em;
    line-height:1.3;
  }

  .post-draw-actions{
    position:relative;
    z-index:1;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:32px;
    opacity:0;
    visibility:hidden;
    transform:translateY(-6px);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }

  .post-draw-actions.show{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }

  /* result overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(5,2,14,0.82);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.45s ease;
    padding:20px;
  }

  .overlay.show{
    opacity:1;
    pointer-events:auto;
  }

  .result-card{
    position:relative;
    width:100%;
    max-width:400px;
    background:
      radial-gradient(circle at 50% 0%, rgba(157,107,255,0.18), transparent 60%),
      linear-gradient(165deg, #241049, #120826 80%);
    border:1px solid rgba(232,196,119,0.4);
    border-radius:18px;
    padding:38px 30px 32px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(123,63,228,0.25);
    transform:scale(0.9) translateY(14px);
    transition:transform 0.45s cubic-bezier(0.22,1,0.36,1);
  }

  .overlay.show .result-card{
    transform:scale(1) translateY(0);
  }

  .result-icon{
    font-size:2.6rem;
    margin-bottom:14px;
    filter:drop-shadow(0 0 16px rgba(232,196,119,0.6));
  }

  .result-tag{
    font-size:0.72rem;
    letter-spacing:0.2em;
    color:var(--purple-soft);
    margin-bottom:8px;
  }

  .result-title{
    font-size:1.4rem;
    font-weight:700;
    color:var(--gold-bright);
    margin-bottom:18px;
  }

  .result-text{
    font-size:0.98rem;
    line-height:1.85;
    color:var(--text);
    margin-bottom:26px;
  }

  .result-score{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:28px;
  }

  .result-score span{
    font-size:1.1rem;
    filter:drop-shadow(0 0 6px rgba(232,196,119,0.5));
  }

  .btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:999px;
    padding:11px 26px;
    font-size:0.88rem;
    letter-spacing:0.03em;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }

  button:active{
    transform:scale(0.96);
  }

  .btn-primary{
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#2a1150;
    font-weight:700;
    box-shadow:0 4px 16px rgba(232,196,119,0.3);
  }

  .btn-primary:hover{
    box-shadow:0 6px 22px rgba(232,196,119,0.45);
  }

  .btn-ghost{
    background:transparent;
    border:1px solid rgba(157,107,255,0.5);
    color:var(--text-dim);
  }

  .btn-ghost:hover{
    border-color:var(--purple-soft);
    color:var(--text);
  }

  footer{
    position:relative;
    z-index:1;
    margin-top:40px;
    font-size:0.75rem;
    color:#5c4f80;
    text-align:center;
  }

  @media (max-width:420px){
    .cards-grid{
      grid-template-columns:repeat(4, minmax(60px, 1fr));
      gap:10px;
    }
  }
</style>
</head>
<body>

<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<div id="stars"></div>

<header>
  <div class="date-tag" id="dateTag">2026. 08. 11</div>
  <h1>오늘의 운세 카드</h1>
  <p class="subtitle">여덟 장의 신비로운 카드 속에 오늘 당신을 위한 메시지가 숨어 있습니다.<br>마음이 이끄는 카드 한 장을 골라보세요.</p>
</header>

<p class="instruction" id="instruction">✧ 카드를 한 장 선택하세요 ✧</p>

<div class="cards-grid" id="cardsGrid"></div>

<div class="post-draw-actions" id="postDrawActions">
  <button class="btn-ghost" id="revealAllBtn">다른 카드 확인하기</button>
  <button class="btn-ghost" id="restartBtn">처음으로</button>
</div>

<footer>매일 다시 방문하여 새로운 운세를 확인해보세요 ✦</footer>

<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-icon" id="resultIcon">✦</div>
    <div class="result-tag" id="resultTag">TODAY'S FORTUNE</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-text" id="resultText"></div>
    <div class="btn-row">
      <button class="btn-primary" id="retryBtn">다시 뽑기</button>
      <button class="btn-ghost" id="closeBtn">카드 다시 보기</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- date ----
  var d = new Date();
  var dateStr = d.getFullYear() + '. ' + String(d.getMonth()+1).padStart(2,'0') + '. ' + String(d.getDate()).padStart(2,'0');
  document.getElementById('dateTag').textContent = dateStr;

  // ---- starfield ----
  var starsWrap = document.getElementById('stars');
  var starCount = 90;
  for(var i=0;i<starCount;i++){
    var s = document.createElement('div');
    s.className = 'star';
    var size = Math.random()*2 + 0.6;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDuration = (Math.random()*3 + 2)+'s';
    s.style.animationDelay = (Math.random()*4)+'s';
    starsWrap.appendChild(s);
  }

  // ---- fortunes pool (8 slots) ----
  var fortunes = [
    {
      icon:'🌙', label:'달의 인도', title:'달의 인도',
      text:'오늘은 조급함을 내려놓아야 할 때입니다. 서두르지 않아도 흐름은 결국 당신 편에 서게 됩니다. 잠시 멈춰 스스로의 감정을 들여다보세요.',
      score:4
    },
    {
      icon:'✨', label:'황금빛 기회', title:'황금빛 기회',
      text:'뜻밖의 제안이나 소식이 찾아올 수 있는 날입니다. 평소 열어두지 않았던 마음의 문을 살짝 열어두면 좋은 인연과 기회를 만나게 됩니다.',
      score:5
    },
    {
      icon:'🔥', label:'타오르는 열정', title:'타오르는 열정',
      text:'미뤄왔던 일을 시작하기에 좋은 기운이 감돕니다. 다만 열정이 앞서 무리하지 않도록 주의하세요. 꾸준함이 오늘의 열쇠입니다.',
      score:4
    },
    {
      icon:'🌊', label:'잔잔한 물결', title:'잔잔한 물결',
      text:'감정의 기복이 있을 수 있는 하루입니다. 타인의 말에 크게 흔들리지 말고, 스스로의 중심을 지키세요. 저녁 무렵 마음이 한결 편안해집니다.',
      score:3
    },
    {
      icon:'⭐', label:'빛나는 인연', title:'빛나는 인연',
      text:'사람과의 관계에서 좋은 기운이 흐릅니다. 오래된 인연에게 먼저 연락해보세요. 예상치 못한 따뜻한 대화가 오늘 하루를 밝혀줍니다.',
      score:5
    },
    {
      icon:'🍀', label:'행운의 씨앗', title:'행운의 씨앗',
      text:'작은 행운이 여러 번 찾아오는 날입니다. 큰 결정보다는 소소한 선택들에서 좋은 결과가 따릅니다. 지갑이나 소지품을 잘 챙기세요.',
      score:4
    },
    {
      icon:'🕯️', label:'내면의 등불', title:'내면의 등불',
      text:'외부보다 내면에 집중해야 할 시기입니다. 혼자만의 시간을 통해 답을 찾을 수 있습니다. 조용한 성찰이 앞으로의 길을 밝혀줄 것입니다.',
      score:3
    },
    {
      icon:'🦋', label:'변화의 바람', title:'변화의 바람',
      text:'익숙했던 것들에 변화가 찾아옵니다. 두려워하지 마세요, 이 변화는 결국 더 나은 방향으로 당신을 이끕니다. 유연한 마음가짐이 필요합니다.',
      score:4
    }
  ];

  // shuffle
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  var grid = document.getElementById('cardsGrid');
  var overlay = document.getElementById('overlay');
  var instruction = document.getElementById('instruction');
  var postDrawActions = document.getElementById('postDrawActions');
  var revealAllBtn = document.getElementById('revealAllBtn');
  var restartBtn = document.getElementById('restartBtn');
  var drawn = false;
  var revealed = false;
  var order;

  function buildCards(){
    grid.innerHTML = '';
    order = shuffle(fortunes);
    drawn = false;
    revealed = false;
    revealAllBtn.textContent = '다른 카드 확인하기';
    postDrawActions.classList.remove('show');
    instruction.textContent = '✧ 카드를 한 장 선택하세요 ✧';

    order.forEach(function(f, idx){
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = idx;

      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back"><span class="back-symbol">✦</span></div>' +
          '<div class="card-face card-front">' +
            '<div class="front-icon">'+f.icon+'</div>' +
            '<div class="front-label">'+f.label+'</div>' +
          '</div>' +
        '</div>';

      card.addEventListener('click', function(){
        if(!drawn){
          drawn = true;
          instruction.textContent = '카드를 확인하는 중...';

          var allCards = grid.querySelectorAll('.card');
          allCards.forEach(function(c){
            if(c !== card){
              c.classList.add('dim', 'disabled');
            } else {
              c.classList.add('selected', 'disabled');
            }
          });

          card.classList.add('flipped');

          setTimeout(function(){
            showResult(f);
            postDrawActions.classList.add('show');
          }, 550);
          return;
        }

        // 이미 뽑은 뒤: 공개된(peek) 카드나 선택했던 카드를 다시 클릭하면 설명을 보여줌
        if(card.classList.contains('peek') || card.classList.contains('selected')){
          showResult(f);
        }
      });

      grid.appendChild(card);
    });
  }

  function showResult(f){
    document.getElementById('resultIcon').textContent = f.icon;
    document.getElementById('resultTitle').textContent = f.title;
    document.getElementById('resultText').textContent = f.text;

    var scoreWrap = document.getElementById('resultScore');
    scoreWrap.innerHTML = '';
    for(var i=0;i<5;i++){
      var star = document.createElement('span');
      star.textContent = i < f.score ? '★' : '☆';
      star.style.color = i < f.score ? '#e8c477' : '#4a3d6b';
      scoreWrap.appendChild(star);
    }

    overlay.classList.add('show');
  }

  document.getElementById('retryBtn').addEventListener('click', function(){
    overlay.classList.remove('show');
    setTimeout(buildCards, 300);
  });

  document.getElementById('closeBtn').addEventListener('click', function(){
    overlay.classList.remove('show');
  });

  revealAllBtn.addEventListener('click', function(){
    revealed = !revealed;
    var others = grid.querySelectorAll('.card:not(.selected)');
    others.forEach(function(c){
      if(revealed){
        c.classList.remove('dim');
        c.classList.add('peek', 'flipped');
      } else {
        c.classList.remove('peek', 'flipped');
        c.classList.add('dim');
      }
    });
    revealAllBtn.textContent = revealed ? '다른 카드 가리기' : '다른 카드 확인하기';
  });

  restartBtn.addEventListener('click', function(){
    overlay.classList.remove('show');
    buildCards();
  });

  buildCards();
})();
</script>

</body>
</html>
